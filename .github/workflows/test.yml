name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unitarias y funcionales
        run: uv run --group test pytest -m "not integration"

      - name: Integración
        if: ${{ github.event_name == 'push' && (matrix.python-version == '3.11' || matrix.python-version == '3.14') }}
        run: uv run --group test pytest -m integration