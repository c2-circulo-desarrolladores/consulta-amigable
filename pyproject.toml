[project]
name = "consulta-amigable"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "httpx2>=2.16.0",
    "narwhals>=2.24.0",
    "packaging>=24.0",
    "rich>=15.0.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Spanish",
]

[project.optional-dependencies]
pandas = ["pandas>=3.0.5"]
polars = ["polars>=1.43.0"]

[project.urls]
Repository = "https://github.com/c2-circulo-desarrolladores/consulta-amigable"
Changelog = "https://github.com/c2-circulo-desarrolladores/consulta-amigable/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff",
]

test = ["pandas>=3.0.5", "polars>=1.43.0", "pytest"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
tag_format = "v$version"
annotated_tag = true
bump_message = "bump: version $current_version → $new_version"
major_version_zero = true
post_bump_hooks = [
    "git push origin HEAD --follow-tags",
]

[tool.ruff.lint]
select = ["F", "I", "E"]
ignore = ["E501"]

[tool.ruff]
extend-exclude = ["README.md"]

[tool.pytest.ini_options]
markers = ["integration: tests que hacen scraping real"]
