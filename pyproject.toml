[project]
name = "consulta-amigable"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "httpx2>=2.16.0",
    "narwhals>=2.24.0",
    "rich>=15.0.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Spanish",
]

[project.urls]
Repository = "https://github.com/c2-circulo-desarrolladores/consulta-amigable"
Changelog = "https://github.com/c2-circulo-desarrolladores/consulta-amigable/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["ruff"]

test = ["pandas>=3.0.5", "polars>=1.43.0", "pytest"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"

[tool.ruff.lint]
select = ["F", "I", "E"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = ["integration: tests que hacen scraping real"]
